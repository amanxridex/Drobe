version: '3.8'

# ==============================================================================
# DROBE ENTERPRISE INFRASTRUCTURE STACK
# Nginx Load Balancer · Multi-Replica Next.js · Redis Cache Layer
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. NGINX LOAD BALANCER & REVERSE PROXY
  # ----------------------------------------------------------------------------
  drobe-loadbalancer:
    image: nginx:1.27-alpine
    container_name: drobe-nginx-lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - drobe-app-1
      - drobe-app-2
    networks:
      - drobe-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. APPLICATION INSTANCE 1 (Next.js Cluster Member A)
  # ----------------------------------------------------------------------------
  drobe-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drobe-app-node-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      - drobe-redis
    networks:
      - drobe-network

  # ----------------------------------------------------------------------------
  # 3. APPLICATION INSTANCE 2 (Next.js Cluster Member B - Load Balanced)
  # ----------------------------------------------------------------------------
  drobe-app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drobe-app-node-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      - drobe-redis
    networks:
      - drobe-network

  # ----------------------------------------------------------------------------
  # 4. REDIS IN-MEMORY STORE & RATE LIMITING
  # ----------------------------------------------------------------------------
  drobe-redis:
    image: redis:7.2-alpine
    container_name: drobe-redis-cache
    restart: unless-stopped
    command: >
      redis-server 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru 
      --save 60 1 
      --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - drobe-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  drobe-network:
    driver: bridge

volumes:
  redis-data:
  nginx-cache:
