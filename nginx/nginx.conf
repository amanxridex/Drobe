# ==============================================================================
# DROBE ENTERPRISE NGINX LOAD BALANCER & REVERSE PROXY CONFIGURATION
# High-Throughput · Microcaching · Rate Limiting · Zero-Trust Security
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/bmp
        image/svg+xml
        image/vnd.microsoft.icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Rate Limiting Zones (DDoS and Bot Abuse Protection)
    limit_req_zone $binary_remote_addr zone=drobe_api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=drobe_general_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=drobe_conn_limit:10m;

    # Edge Microcaching Zone
    proxy_cache_path /var/cache/nginx/drobe_cache 
                     levels=1:2 
                     keys_zone=drobe_edge_cache:20m 
                     max_size=2g 
                     inactive=120m 
                     use_temp_path=off;

    # Logging with Cache Status & Timing Telemetry
    log_format drobe_combined '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                              'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log drobe_combined;
    error_log /var/log/nginx/error.log warn;

    # ==============================================================================
    # UPSTREAM LOAD BALANCER POOL (Active Next.js Cluster)
    # ==============================================================================
    upstream drobe_app_cluster {
        least_conn; # Distribute connections to least loaded instance
        server drobe-app-1:3005 max_fails=3 fail_timeout=10s;
        server drobe-app-2:3005 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # ==============================================================================
    # HTTP -> HTTPS REDIRECT & ACME CHALLENGE
    # ==============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name drobe.in www.drobe.in localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # For production HTTPS enforcement
        # return 301 https://$host$request_uri;

        # Standard forward for development / internal load balancing
        location / {
            proxy_pass http://drobe_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==============================================================================
    # HTTPS PRODUCTION SERVER BLOCK (Edge Terminated)
    # ==============================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name drobe.in www.drobe.in;

        # SSL Configuration (Mount valid certs in /etc/nginx/ssl/)
        ssl_certificate /etc/nginx/ssl/drobe.crt;
        ssl_certificate_key /etc/nginx/ssl/drobe.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Zero-Trust Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Cache-Status $upstream_cache_status always;

        limit_conn drobe_conn_limit 50;

        # Health Check Endpoint
        location = /healthz {
            access_log off;
            return 200 '{"status":"healthy","service":"drobe-load-balancer","hub":"AMD-DARKSTORE-01"}';
            add_header Content-Type application/json;
        }

        # Next.js Static Bundles (Cache at Edge for 1 Year)
        location /_next/static/ {
            proxy_pass http://drobe_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache drobe_edge_cache;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Media & Real Assets
        location /assets/ {
            proxy_pass http://drobe_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache drobe_edge_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # API Routes (Rate-Limited with Microcaching on GET)
        location /api/ {
            limit_req zone=drobe_api_limit burst=20 nodelay;

            proxy_pass http://drobe_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Bypass cache for stateful mutations (POST/PUT/DELETE)
            proxy_cache drobe_edge_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 30s; # 30s microcache
            proxy_cache_bypass $http_pragma $http_authorization $cookie_session;
            proxy_no_cache $http_pragma $http_authorization $cookie_session;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # All other dynamic Next.js App Router Pages
        location / {
            limit_req zone=drobe_general_limit burst=50 nodelay;

            proxy_pass http://drobe_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js HMR and live updates
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
